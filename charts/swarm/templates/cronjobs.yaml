{{- range $name, $job := .Values.jobs }}
{{- if ne (toString $job.enabled) "false" }}
{{- $d := $.Values.defaults }}
{{- $repo := $job.repository | default $.Values.github.repository }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "swarm.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  schedule: {{ required (printf "jobs.%s.schedule is required" $name) $job.schedule | quote }}
  {{- with $job.timeZone }}
  timeZone: {{ . }}
  {{- end }}
  suspend: {{ $job.suspend | default false }}
  concurrencyPolicy: {{ $job.concurrencyPolicy | default $d.concurrencyPolicy }}
  startingDeadlineSeconds: {{ $job.startingDeadlineSeconds | default $d.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ $d.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $d.failedJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: swarm
        app.kubernetes.io/component: {{ $name }}
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ $job.activeDeadlineSeconds | default $d.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ $d.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: swarm
            app.kubernetes.io/component: {{ $name }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: run
              image: {{ $.Values.image }}
              command: ["node", "/opt/swarm/run.mjs"]
              args:
                {{- range required (printf "jobs.%s.run is required: the script and its arguments" $name) $job.run }}
                - {{ . | toString | quote }}
                {{- end }}
              env:
                - name: GITHUB_REPOSITORY
                  value: {{ required (printf "github.repository (or jobs.%s.repository) is required: the owner/name of the repository the job works on" $name) $repo | quote }}
                - name: SOURCE_REPOSITORY
                  value: {{ $job.source | default $repo | quote }}
                - name: SOURCE_REF
                  value: {{ $job.ref | default $.Values.github.ref | quote }}
                - name: GITHUB_SERVER_URL
                  value: https://github.com
                - name: HOME
                  value: /tmp
                {{- with $.Values.metrics.pushgatewayUrl }}
                - name: SWARM_PUSHGATEWAY_URL
                  value: {{ . | quote }}
                {{- end }}
                {{- with $.Values.linear.secretName }}
                - name: LINEAR_CLIENT_ID
                  valueFrom: { secretKeyRef: { name: {{ . }}, key: client-id, optional: true } }
                - name: LINEAR_CLIENT_SECRET
                  valueFrom: { secretKeyRef: { name: {{ . }}, key: client-secret, optional: true } }
                - name: LINEAR_API_KEY
                  valueFrom: { secretKeyRef: { name: {{ . }}, key: api-key, optional: true } }
                {{- end }}
                {{- with $.Values.linear.teams }}
                - name: LINEAR_TEAMS
                  value: {{ . | quote }}
                {{- end }}
                - name: SWARM_APP_ID
                  valueFrom: { secretKeyRef: { name: {{ $.Values.github.secretName }}, key: app-id } }
                - name: SWARM_APP_KEY
                  valueFrom: { secretKeyRef: { name: {{ $.Values.github.secretName }}, key: private-key } }
                {{- range $k, $v := $job.env }}
                - name: {{ $k }}
                  value: {{ $v | quote }}
                {{- end }}
                {{- range $k, $v := $job.secretEnv }}
                - name: {{ $k }}
                  valueFrom: { secretKeyRef: { name: {{ required "extraSecretName is required when a job sets secretEnv" $.Values.extraSecretName }}, key: {{ $v }}, optional: true } }
                {{- end }}
              resources:
                {{- toYaml $d.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: run, mountPath: /opt/swarm, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: run
              configMap: { name: {{ $.Release.Name }}-run }
            - name: tmp
              emptyDir: { sizeLimit: 1Gi }
{{- end }}
{{- end }}
