# Node image the jobs run in. Each run downloads the tarball of the job's
# source repository at its ref and runs one of its scripts, so a change to a
# script on that ref takes effect at the next run.
image: node:24.11.1-alpine3.22

github:
  # Required: owner/name of the repository the jobs work on.
  repository: ""
  # The ref scripts are taken from, unless a job sets its own.
  ref: main
  # Secret holding the GitHub App's `app-id` and `private-key` (README.md,
  # "GitHub App").
  secretName: swarm-github-app

# Secret that `secretEnv` reads from. Keys missing from it leave the variable
# unset. Required only when a job sets `secretEnv`.
extraSecretName: ""

defaults:
  # A run that's still going when the next is due is left alone, not doubled.
  concurrencyPolicy: Forbid
  # A run missed by more than this (the node was down) is skipped, not caught up.
  startingDeadlineSeconds: 300
  activeDeadlineSeconds: 900
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  ttlSecondsAfterFinished: 3600
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

# One CronJob per entry, named by its key.
#   schedule   cron expression; `timeZone` is optional
#   run        the script and its arguments, from the root of `source`
#   source     the repository that holds the script (github.repository when
#              unset; another one must be public or in the App's installation)
#   ref        the ref of `source` to run (github.ref when unset)
#   env        plain variables
#   secretEnv  maps a variable to a key of extraSecretName
#   enabled    false removes the CronJob; `suspend: true` keeps it but paused
#   concurrencyPolicy, startingDeadlineSeconds, activeDeadlineSeconds
#              override `defaults` for this job
# GITHUB_TOKEN, GH_TOKEN, READ_TOKEN, POST_TOKEN and PROJECT_TOKEN are always
# the App's installation token.
#
# The two below run this repository's own tools. Add your own beside them, or
# change one by setting only the keys that differ.
jobs:
  # Writes the `reviewed` status on each open PR's head.
  agent-reviewed:
    schedule: "*/2 * * * *"
    activeDeadlineSeconds: 110
    source: getcouchy/swarm
    run: [reviewed.mjs]
    env: {}
    # REVIEWED_CREATOR: my-app[bot]   # only this login's status counts as already posted

  # Frees stale agent locks and rewrites the "Agent desk" issue with what is overdue.
  agent-sweep:
    schedule: "*/10 * * * *"
    source: getcouchy/swarm
    run: [sweep.mjs]
    env: {}
    # AGENT_CLAIM_MINUTES, AGENT_READY_HOURS... override the script's defaults.
